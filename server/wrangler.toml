# Cloudflare Workers deployment for the Postmark server.
# `npm run deploy:cloudflare` creates the D1 database, fills in database_id, applies migrations
# and deploys. See README → "Deploy for free on Cloudflare".
name = "postmark"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "postmark"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *"]

[vars]
APPLE_MPP_CIDRS = "17.0.0.0/8"
RETENTION_DAYS = "0"
LOG_LEVEL = "info"
